AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple  lambda function

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  AlertEmail:
    Type: String
    Default: 'ops-team@example.com'

Resources:
  # Parameter Store — non-sensitive config
  ApiUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/hello-world/${Environment}/api-url'
      Type: String
      Value: 'https://api.example.com'

  # Secrets Manager — sensitive value
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'hello-world/${Environment}/api-key'
      SecretString: '{"api_key": "replace-with-real-secret"}'

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-${Environment}
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      CodeUri: src/
      MemorySize: 128
      Timeout: 10
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: !Sub 'hello-world/${Environment}/api-url'
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref ApiKeySecret
      Environment:
        Variables:
          LOG_LEVEL: INFO
          ENV: !Ref Environment
          SSM_PARAMETER_NAME: !Sub '/hello-world/${Environment}/api-url'
          SECRET_ARN: !Ref ApiKeySecret

# Alert Resources
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'alerts-hello-world-${Environment}'

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref AlertEmail
      Protocol: email
      TopicArn: !Ref AlarmNotificationTopic

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub 'Alert when hello-world-${Environment} fails'
      AlarmActions:
        - !Ref AlarmNotificationTopic
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref HelloFunction

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub 'Alert when hello-world-${Environment} is throttled'
      AlarmActions:
        - !Ref AlarmNotificationTopic
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref HelloFunction
